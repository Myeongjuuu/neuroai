# Initial Llama 3.2 integration for the default EEG mental_arithmetic dataset.
# LabelEncoder sorts the source labels: mental_arithmetic=0, rest=1.
brain_model_config:
  =replace=: true
  name: Llama32EEG
  model_name: meta-llama/Llama-3.2-3B-Instruct
  prompt: "Classify this EEG segment. Is the person doing mental arithmetic (A) or resting (B)? Reply with A or B only."
  answers: [A, B]
  n_eeg_tokens: 16
  torch_dtype: bfloat16
downstream_model_wrapper: null
data:
  batch_size: 2
trainer_config:
  precision: bf16-mixed
